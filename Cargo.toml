[package]
name = "magicmtn-provider-ollama"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Local Ollama inference provider for MagicMtn"

readme = "README.md"
keywords = ["magicmtn", "ollama", "inference", "llm"]
include = [
    "package.sh",
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "SDK_REVISION",
    "tests/**/*.rs",
    "README.md",
    "CONTRIBUTING.md",
    "AGENTS.md",
    ".cargo/config.toml.example",
    "LICENSE",
    ".github/assets/*.svg",
]

[package.metadata.magicmtn]
protocol-version = 1

[[bin]]
name = "magicmtn-provider-ollama"
path = "src/main.rs"
required-features = ["plugin"]

[features]
default = ["plugin"]
plugin = ["dep:magicmtn-provider-framework", "tokio/macros", "tokio/rt"]

[dependencies]
magicmtn-provider-framework = { version = "0.1.0", optional = true }
magicmtn-sdk = "0.1.0"
anyhow = "1.0.86"
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"
url = "2"
tokio = { version = "1", optional = true }

[dev-dependencies]
magicmtn-provider-framework = { version = "0.1.0", features = ["host"] }
tempfile = "3"
axum = "0.7.5"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
