name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: provider
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: provider
          persist-credentials: false
      - name: Read SDK revision
        id: sdk
        run: echo "revision=$(cat SDK_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: useMagicMtn/magicmtn
          ref: ${{ steps.sdk.outputs.revision }}
          path: magicmtn
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Use the development SDK checkout
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch.crates-io]
          magicmtn-sdk = { path = "../magicmtn/sdk/rust/magicmtn-sdk" }
          magicmtn-provider-framework = { path = "../magicmtn/sdk/rust/magicmtn-provider-framework" }
          EOF
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets --no-default-features -- -D warnings
      - run: ./package.sh
      - run: cargo test --locked --test sdk_host maintainer_archive_installs_and_dispatches_with_current_sdk -- --ignored
